server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 64k;

    # Fixed A-service routing: no optional reviewer DNS or provider configuration.
    # The URI, including /api, is preserved by proxy_pass without a path suffix.
    location /api/ {
        proxy_pass http://analysis:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_intercept_errors off;
        error_page 502 503 =503 @analysis_unavailable;
        error_page 504 =504 @analysis_timeout;
        add_header Cache-Control "no-store" always;
    }

    location = /api {
        default_type application/json;
        return 404 '{"error":{"code":"INVALID_ROUTE","message":"Use a defined /api/ endpoint.","retryable":false,"request_id":"dashboard-proxy"}}';
    }

    # Preserve application error bodies; normalize only proxy-generated errors.
    location @analysis_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The analysis service is unavailable.","retryable":true,"request_id":"dashboard-proxy"}}';
    }

    location @analysis_timeout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"The analysis service exceeded the proxy time limit.","retryable":true,"request_id":"dashboard-proxy"}}';
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        return 404;
    }

    # History/hash-based dashboard navigation both keep the React entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
